name: Build and Push Docker Image (IA)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ia

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Les secrets Mistral sont injectés via les build-args
          build-args: |
            MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}
            MISTRAL_API_BASE=${{ secrets.MISTRAL_API_BASE }}
            MISTRAL_MODEL=${{ secrets.MISTRAL_MODEL }}
            MISTRAL_TIMEOUT_S=${{ secrets.MISTRAL_TIMEOUT_S }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
