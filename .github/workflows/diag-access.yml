name: Access diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Test LITELLM key (status only)
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_API_BASE: ${{ secrets.LITELLM_API_BASE }}
          LITELLM_MODEL: ${{ secrets.LITELLM_MODEL }}
        run: |
          echo "LITELLM_MODEL=$LITELLM_MODEL"
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 30 \
            "${LITELLM_API_BASE%/}/chat/completions" \
            -H "Authorization: Bearer $LITELLM_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"'"$LITELLM_MODEL"'","messages":[{"role":"user","content":"Réponds uniquement: OK"}],"max_tokens":5}')
          echo "chat/completions -> HTTP $code"
          head -c 400 /tmp/resp.json

      - name: Org SSH secrets visibility (boolean only)
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          [ -n "$VPS_IP" ] && echo "VPS_IP: present" || echo "VPS_IP: EMPTY"
          [ -n "$VPS_USER" ] && echo "VPS_USER: present" || echo "VPS_USER: EMPTY"
          [ -n "$SSH_PRIVATE_KEY" ] && echo "SSH_PRIVATE_KEY: present" || echo "SSH_PRIVATE_KEY: EMPTY"
