name: List LITELLM models
on:
  workflow_dispatch:
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - name: GET /models
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_API_BASE: ${{ secrets.LITELLM_API_BASE }}
        run: |
          curl -s --max-time 20 "${LITELLM_API_BASE%/}/models" -H "Authorization: Bearer $LITELLM_API_KEY" | head -c 1500
